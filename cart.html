<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAGING - 장바구니</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f5f5f5;
            color: #212121;
            min-height: 100vh;
        }

        .staging-banner {
            background: repeating-linear-gradient(45deg, #ff5252, #ff5252 12px, #d32f2f 12px, #d32f2f 24px);
            color: #fff;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Courier New', monospace;
        }

        .staging-banner .left,
        .staging-banner .right {
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
        }

        .site-header {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 22px; font-weight: 700; color: #212121; letter-spacing: -0.5px; }
        .logo .accent { color: #ff5722; }

        .header-actions { display: flex; gap: 18px; align-items: center; }
        .header-icon { font-size: 20px; color: #555; cursor: pointer; }

        .page-container {
            max-width: 600px;
            margin: 24px auto;
            padding: 0 24px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: #212121;
            margin-bottom: 20px;
        }

        .cart-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 56px 1fr auto;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            align-items: center;
        }

        .cart-item:last-child { border-bottom: none; }

        .cart-item-img {
            width: 56px;
            height: 56px;
            background: #eceff1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #607d8b;
        }

        .cart-item-name { font-size: 13px; font-weight: 500; color: #212121; margin-bottom: 4px; }
        .cart-item-option { font-size: 11px; color: #888; }
        .cart-item-price { font-size: 14px; font-weight: 700; color: #ff5722; font-family: 'Courier New', monospace; }

        .coupon-section {
            background: #fff;
            border-radius: 12px;
            padding: 20px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }

        .coupon-title { font-size: 13px; color: #555; margin-bottom: 10px; font-weight: 500; }

        .coupon-input-row { display: flex; gap: 8px; }

        .coupon-input {
            flex: 1;
            border: 1px solid #bdbdbd;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }

        .coupon-apply {
            background: #212121;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .coupon-suggestions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }

        .coupon-chip {
            font-size: 11px;
            background: #fff;
            border: 1px dashed #ff5722;
            color: #ff5722;
            padding: 3px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        .coupon-applied {
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 4px;
            margin-top: 8px;
            display: none;
            font-weight: 500;
        }

        .coupon-applied.show { display: block; }

        .summary-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }

        .summary-title { font-size: 14px; font-weight: 700; color: #212121; margin-bottom: 14px; }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
        }

        .summary-row.discount { color: #ff5722; }

        .summary-row.total {
            border-top: 1px solid #e0e0e0;
            padding-top: 10px;
            margin-top: 10px;
            margin-bottom: 0;
            font-size: 16px;
            font-weight: 700;
            color: #212121;
        }

        .summary-row .v { font-family: 'Courier New', monospace; font-weight: 700; }
        .summary-row.total .v { color: #ff5722; }

        .btn-checkout {
            width: 100%;
            background: #ff5722;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            margin-bottom: 8px;
        }

        .btn-back {
            width: 100%;
            background: #fff;
            color: #212121;
            border: 1.5px solid #212121;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-back:hover { background: #f5f5f5; }
        .btn-checkout:hover { background: #f4511e; }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-size: 14px;
        }

        .empty-cart-icon { font-size: 48px; margin-bottom: 12px; }

        /* 체크아웃 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: #fff;
            border-radius: 12px;
            width: 90%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .modal-title { font-size: 18px; font-weight: 700; color: #212121; }

        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #888;
            font-family: inherit;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #212121;
            color: #fff;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 200;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-8px);
        }
    </style>
</head>
<body>

    <!-- 스테이징 환경 배너 -->
    <div class="staging-banner" id="cart-staging-banner" name="장바구니스테이징배너">
        <span class="left" id="cart-staging-label-left" name="장바구니스테이징라벨" data-text="⚠ STAGING ENVIRONMENT">⚠ STAGING ENVIRONMENT</span>
        <span id="cart-staging-build-info" name="장바구니빌드정보" data-text="build #2026.05.19-rc.7 · branch: feature/promo-bundle-15">build #2026.05.19-rc.7 · branch: feature/promo-bundle-15</span>
        <span class="right" id="cart-staging-label-right" name="장바구니QA라벨" data-text="QA TEST MODE">QA TEST MODE</span>
    </div>

    <!-- 헤더 -->
    <header class="site-header" id="cart-site-header" name="장바구니헤더">
        <a href="prodtest.html" style="text-decoration:none;">
            <div class="logo" id="cart-site-logo" name="장바구니로고" data-text="SHOPFRONT">SHOP<span class="accent">FRONT</span></div>
        </a>
        <div class="header-actions" id="cart-header-actions" name="장바구니헤더액션">
            <span class="header-icon" id="cart-btn-back" name="뒤로가기버튼" data-text="← 쇼핑 계속하기" onclick="location.href='prodtest.html'" style="font-size:13px; cursor:pointer;">← 쇼핑 계속하기</span>
        </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <div class="page-container" id="cart-page-container" name="장바구니페이지컨테이너">

        <div class="page-title" id="cart-page-title" name="장바구니페이지제목" data-text="🛒 장바구니">🛒 장바구니</div>

        <!-- 장바구니 상품 목록 -->
        <div class="cart-card" id="cart-items-card" name="장바구니상품카드">
            <div id="cart-items-list" name="장바구니상품목록">
                <div id="cart-empty-message" name="장바구니비어있음메시지" class="empty-cart">
                    <div class="empty-cart-icon" id="cart-empty-icon" name="빈장바구니아이콘" data-text="🛒">🛒</div>
                    <div id="cart-empty-text" name="빈장바구니텍스트" data-text="장바구니가 비어있습니다.">장바구니가 비어있습니다.</div>
                </div>
            </div>
        </div>

        <!-- 쿠폰 영역 -->
        <div class="coupon-section" id="cart-coupon-section" name="장바구니쿠폰영역" style="display:none;">
            <div class="coupon-title" id="cart-coupon-title" name="쿠폰적용제목" data-text="🎟 쿠폰 적용">🎟 쿠폰 적용</div>
            <div class="coupon-input-row" id="cart-coupon-input-row" name="쿠폰입력행">
                <input type="text" class="coupon-input" id="cart-coupon-input" name="쿠폰코드입력필드" placeholder="쿠폰 코드 입력">
                <button class="coupon-apply" id="cart-btn-coupon-apply" name="쿠폰적용버튼" data-text="적용" onclick="applyCoupon()">적용</button>
            </div>
            <div class="coupon-suggestions" id="cart-coupon-suggestions" name="쿠폰추천목록">
                <span class="coupon-chip" id="cart-coupon-chip-bundle15" name="쿠폰칩BUNDLE15" data-text="BUNDLE15" onclick="setCoupon('BUNDLE15')">BUNDLE15</span>
                <span class="coupon-chip" id="cart-coupon-chip-vip-extra5" name="쿠폰칩VIP-EXTRA5" data-text="VIP-EXTRA5" onclick="setCoupon('VIP-EXTRA5')">VIP-EXTRA5</span>
                <span class="coupon-chip" id="cart-coupon-chip-free-delivery" name="쿠폰칩FREE-DELIVERY" data-text="FREE-DELIVERY" onclick="setCoupon('FREE-DELIVERY')">FREE-DELIVERY</span>
            </div>
            <div class="coupon-applied" id="cart-coupon-applied" name="쿠폰적용결과메시지"></div>
        </div>

        <!-- 주문 요약 -->
        <div class="summary-card" id="cart-summary-card" name="주문요약카드" style="display:none;">
            <div class="summary-title" id="cart-summary-title" name="주문요약제목" data-text="주문 요약">주문 요약</div>
            <div class="summary-row" id="cart-summary-row-subtotal" name="상품합계행">
                <span id="cart-summary-subtotal-label" name="상품합계라벨" data-text="상품 합계">상품 합계</span>
                <span class="v" id="cart-s-subtotal" name="상품합계금액" data-text="₩0">₩0</span>
            </div>
            <div class="summary-row discount" id="cart-s-bundle-row" name="번들할인행">
                <span id="cart-summary-bundle-label" name="번들할인라벨" data-text="번들 할인 (15%)">번들 할인 (15%)</span>
                <span class="v" id="cart-s-bundle" name="번들할인금액" data-text="-₩0">-₩0</span>
            </div>
            <div class="summary-row discount" id="cart-s-coupon-row" name="쿠폰할인행" style="display:none;">
                <span id="cart-s-coupon-label" name="쿠폰할인라벨" data-text="쿠폰 할인">쿠폰 할인</span>
                <span class="v" id="cart-s-coupon" name="쿠폰할인금액" data-text="-₩0">-₩0</span>
            </div>
            <div class="summary-row" id="cart-summary-row-shipping" name="배송비행">
                <span id="cart-summary-shipping-label" name="배송비라벨" data-text="배송비">배송비</span>
                <span class="v" id="cart-s-shipping" name="배송비금액" data-text="₩3,000">₩3,000</span>
            </div>
            <div class="summary-row total" id="cart-summary-row-total" name="최종결제금액행">
                <span id="cart-summary-total-label" name="최종결제금액라벨" data-text="최종 결제 금액">최종 결제 금액</span>
                <span class="v" id="cart-s-total" name="최종결제금액" data-text="₩0">₩0</span>
            </div>
        </div>

        <!-- 액션 버튼 -->
        <div id="cart-action-area" name="장바구니액션영역" style="display:none;">
            <button class="btn-checkout" id="cart-btn-checkout" name="결제하기버튼" data-text="결제하기" onclick="checkout()">결제하기</button>
            <button class="btn-back" id="cart-btn-continue-shopping" name="쇼핑계속하기버튼" data-text="쇼핑 계속하기" onclick="location.href='prodtest.html'">쇼핑 계속하기</button>
        </div>
    </div>

    <!-- 체크아웃 모달 -->
    <div class="modal-overlay" id="cart-checkout-modal" name="결제확인모달오버레이">
        <div class="modal" id="cart-checkout-modal-content" name="결제확인모달">
            <div class="modal-header" id="cart-checkout-modal-header" name="결제확인모달헤더">
                <span class="modal-title" id="cart-checkout-modal-title" name="결제확인모달제목" data-text="💳 결제 확인">💳 결제 확인</span>
                <button class="modal-close" id="cart-btn-checkout-modal-close" name="결제확인모달닫기버튼" data-text="×" onclick="closeModal()">×</button>
            </div>
            <div id="cart-checkout-summary" name="결제요약내용"></div>
            <button class="btn-checkout" id="cart-btn-complete-order" name="결제완료버튼" data-text="결제 완료" onclick="completeOrder()">결제 완료</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="cart-toast-notification" name="장바구니토스트알림"></div>

    <script>
        const REGULAR = 208000;
        const BUNDLE = 176800;
        const SHIPPING = 3000;

        let cartState = JSON.parse(localStorage.getItem('prodtest_cart') || '[]');
        let couponState = localStorage.getItem('prodtest_coupon') || null;

        function init() {
            renderCart();
        }

        function toast(msg) {
            const t = document.getElementById('cart-toast-notification');
            t.textContent = msg;
            t.setAttribute('data-text', msg);
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        function renderCart() {
            const list = document.getElementById('cart-items-list');
            const couponSec = document.getElementById('cart-coupon-section');
            const summaryCard = document.getElementById('cart-summary-card');
            const actionArea = document.getElementById('cart-action-area');

            if (cartState.length === 0) {
                list.innerHTML = `
                    <div id="cart-empty-message" name="장바구니비어있음메시지" class="empty-cart">
                        <div class="empty-cart-icon" id="cart-empty-icon" name="빈장바구니아이콘" data-text="🛒">🛒</div>
                        <div id="cart-empty-text" name="빈장바구니텍스트" data-text="장바구니가 비어있습니다.">장바구니가 비어있습니다.</div>
                    </div>`;
                couponSec.style.display = 'none';
                summaryCard.style.display = 'none';
                actionArea.style.display = 'none';
                return;
            }

            list.innerHTML = cartState.map((item, i) => `
                <div class="cart-item" id="cart-item-${i}" name="장바구니상품${i + 1}">
                    <div class="cart-item-img" id="cart-item-img-${i}" name="장바구니상품이미지${i + 1}" data-text="👟">👟</div>
                    <div>
                        <div class="cart-item-name" id="cart-item-name-${i}" name="장바구니상품명${i + 1}" data-text="${item.name}">${item.name}</div>
                        <div class="cart-item-option" id="cart-item-option-${i}" name="장바구니상품옵션${i + 1}" data-text="${item.option} · 수량 ${item.qty}">${item.option} · 수량 ${item.qty}</div>
                    </div>
                    <div class="cart-item-price" id="cart-item-price-${i}" name="장바구니상품가격${i + 1}" data-text="₩${(item.bundle * item.qty).toLocaleString()}">₩${(item.bundle * item.qty).toLocaleString()}</div>
                </div>
            `).join('');

            couponSec.style.display = 'block';
            summaryCard.style.display = 'block';
            actionArea.style.display = 'block';

            updateSummary();
        }

        function updateSummary() {
            const subtotal = cartState.reduce((s, x) => s + x.regular * x.qty, 0);
            const bundleDiscount = cartState.reduce((s, x) => s + (x.regular - x.bundle) * x.qty, 0);
            const afterBundle = subtotal - bundleDiscount;

            let couponDiscount = 0;
            let couponLabel = '쿠폰 할인';
            if (couponState) {
                if (couponState === 'BUNDLE15') {
                    couponDiscount = 0;
                    couponLabel = `${couponState} (이미 적용됨)`;
                } else if (couponState === 'VIP-EXTRA5') {
                    couponDiscount = Math.round(afterBundle * 0.05);
                    couponLabel = `${couponState} (-5%)`;
                } else if (couponState === 'FREE-DELIVERY') {
                    couponDiscount = SHIPPING;
                    couponLabel = `${couponState} (배송비 무료)`;
                }
            }

            const finalTotal = couponState === 'FREE-DELIVERY'
                ? afterBundle
                : afterBundle - couponDiscount + SHIPPING;

            const elSubtotal = document.getElementById('cart-s-subtotal');
            elSubtotal.textContent = '₩' + subtotal.toLocaleString();
            elSubtotal.setAttribute('data-text', '₩' + subtotal.toLocaleString());

            const elBundle = document.getElementById('cart-s-bundle');
            elBundle.textContent = '-₩' + bundleDiscount.toLocaleString();
            elBundle.setAttribute('data-text', '-₩' + bundleDiscount.toLocaleString());

            const couponRow = document.getElementById('cart-s-coupon-row');
            if (couponState) {
                couponRow.style.display = 'flex';
                const elCouponLabel = document.getElementById('cart-s-coupon-label');
                elCouponLabel.textContent = couponLabel;
                elCouponLabel.setAttribute('data-text', couponLabel);
                const elCoupon = document.getElementById('cart-s-coupon');
                if (couponState === 'FREE-DELIVERY') {
                    elCoupon.textContent = '-₩' + SHIPPING.toLocaleString();
                    elCoupon.setAttribute('data-text', '-₩' + SHIPPING.toLocaleString());
                } else {
                    elCoupon.textContent = '-₩' + couponDiscount.toLocaleString();
                    elCoupon.setAttribute('data-text', '-₩' + couponDiscount.toLocaleString());
                }
            } else {
                couponRow.style.display = 'none';
            }

            const elShipping = document.getElementById('cart-s-shipping');
            const shippingText = couponState === 'FREE-DELIVERY' ? '₩0 (무료)' : '₩' + SHIPPING.toLocaleString();
            elShipping.textContent = shippingText;
            elShipping.setAttribute('data-text', shippingText);

            const elTotal = document.getElementById('cart-s-total');
            elTotal.textContent = '₩' + finalTotal.toLocaleString();
            elTotal.setAttribute('data-text', '₩' + finalTotal.toLocaleString());
        }

        function setCoupon(code) {
            document.getElementById('cart-coupon-input').value = code;
        }

        function applyCoupon() {
            const code = document.getElementById('cart-coupon-input').value.trim().toUpperCase();
            const valid = ['BUNDLE15', 'VIP-EXTRA5', 'FREE-DELIVERY'];
            const applied = document.getElementById('cart-coupon-applied');

            if (!code) {
                toast('쿠폰 코드를 입력해주세요');
                return;
            }

            if (valid.includes(code)) {
                couponState = code;
                localStorage.setItem('prodtest_coupon', code);
                applied.classList.add('show');
                applied.style.background = '#e8f5e9';
                applied.style.color = '#2e7d32';
                applied.textContent = `✓ 쿠폰 "${code}" 이(가) 적용되었습니다.`;
                applied.setAttribute('data-text', `✓ 쿠폰 "${code}" 이(가) 적용되었습니다.`);
                updateSummary();
            } else {
                couponState = null;
                localStorage.removeItem('prodtest_coupon');
                applied.classList.add('show');
                applied.style.background = '#ffebee';
                applied.style.color = '#c62828';
                applied.textContent = `✗ 유효하지 않은 쿠폰 코드입니다.`;
                applied.setAttribute('data-text', `✗ 유효하지 않은 쿠폰 코드입니다.`);
                updateSummary();
            }
        }

        function checkout() {
            const total = document.getElementById('cart-s-total').textContent;
            const subtotal = document.getElementById('cart-s-subtotal').textContent;
            const bundle = document.getElementById('cart-s-bundle').textContent;
            const couponRow = document.getElementById('cart-s-coupon-row');
            const couponHtml = couponRow.style.display !== 'none'
                ? `<div class="summary-row discount" id="checkout-row-coupon" name="결제쿠폰할인행"><span id="checkout-coupon-label" name="결제쿠폰할인라벨" data-text="${document.getElementById('cart-s-coupon-label').textContent}">${document.getElementById('cart-s-coupon-label').textContent}</span><span class="v" id="checkout-coupon-value" name="결제쿠폰할인금액" data-text="${document.getElementById('cart-s-coupon').textContent}">${document.getElementById('cart-s-coupon').textContent}</span></div>`
                : '';

            document.getElementById('cart-checkout-summary').innerHTML = `
                <div id="checkout-description" name="결제안내문구" data-text="아래 금액으로 결제가 진행됩니다." style="font-size:13px; color:#555; margin-bottom:14px;">
                    아래 금액으로 결제가 진행됩니다.
                </div>
                <div class="summary-card" id="checkout-summary-block" name="결제요약블록" style="box-shadow:none; padding:14px 0;">
                    <div class="summary-row" id="checkout-row-subtotal" name="결제상품합계행"><span id="checkout-subtotal-label" name="결제상품합계라벨" data-text="상품 합계">상품 합계</span><span class="v" id="checkout-subtotal-value" name="결제상품합계금액" data-text="${subtotal}">${subtotal}</span></div>
                    <div class="summary-row discount" id="checkout-row-bundle" name="결제번들할인행"><span id="checkout-bundle-label" name="결제번들할인라벨" data-text="번들 할인">번들 할인</span><span class="v" id="checkout-bundle-value" name="결제번들할인금액" data-text="${bundle}">${bundle}</span></div>
                    ${couponHtml}
                    <div class="summary-row" id="checkout-row-shipping" name="결제배송비행"><span id="checkout-shipping-label" name="결제배송비라벨" data-text="배송비">배송비</span><span class="v" id="checkout-shipping-value" name="결제배송비금액" data-text="${document.getElementById('cart-s-shipping').textContent}">${document.getElementById('cart-s-shipping').textContent}</span></div>
                    <div class="summary-row total" id="checkout-row-total" name="결제최종금액행"><span id="checkout-total-label" name="결제최종금액라벨" data-text="최종 결제 금액">최종 결제 금액</span><span class="v" id="checkout-total-value" name="결제최종결제금액" data-text="${total}">${total}</span></div>
                </div>
            `;
            document.getElementById('cart-checkout-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('cart-checkout-modal').classList.remove('active');
        }

        function completeOrder() {
            toast('✓ 주문이 완료되었습니다 (STAGING TEST)');
            closeModal();
            cartState = [];
            couponState = null;
            localStorage.removeItem('prodtest_cart');
            localStorage.removeItem('prodtest_coupon');
            renderCart();
        }

        init();
    </script>

</body>
</html>
